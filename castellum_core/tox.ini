[tox]
envlist = py35,flake8


[pytest]
addopts =
    --ds=castellum_core.settings
    --cov=castellum_core
    --cov-report term-missing
    --cov-report html
    --cov-fail-under=80


[flake8]
exclude=
    .git,
    .env,
    .tox,
    node_modules,
    wsgi.py,
    migrations,
max-line-length=100


[testenv]
deps =
    pytest-django
    pytest-cov
setenv =
    PYTHONPATH = {toxinidir}/castellum_core:{env:PYTHONPATH:}
commands =
    pytest tests/


[testenv:flake8]
deps = flake8
commands = flake8

[coverage:report]
omit=
    */migrations/*
    */wsgi.py
    */manage.py
