[tox]
envlist = py35,flake8


[flake8]
exclude=
    .git,
    .env,
    .tox,
    node_modules,
    wsgi.py,
    migrations,
max-line-length=100


[testenv]
deps = pytest-django
setenv =
    DJANGO_SETTINGS_MODULE = castellum_core.settings
    PYTHONPATH = {toxinidir}/castellum_core:{env:PYTHONPATH:}
commands =
    pytest tests/

[testenv:flake8]
deps = flake8
commands = flake8
