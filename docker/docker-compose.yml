version: '2'

services:
  db_default:
    image: postgres
  db_subject_management:
    image: postgres
  ldap:
    container_name: ldap
    image: osixia/openldap
    ports:
      - "389:389"
    command: [--copy-service]
    volumes:
      - ./docker/example_deployment/dummy_data.ldif:/container/service/slapd/assets/config/bootstrap/ldif/data.ldif
  web:
    build:
      context: ..
      dockerfile: ./docker/castellum/Dockerfile
    environment:
      DJANGO_SETTINGS_MODULE: castellum_core.settings.example
    command: "uwsgi castellum_core/uwsgi.ini"
    ports:
      - "8000:8000"
    volumes:
      - ./example_deployment/settings.py:/code/castellum_core/castellum_core/settings/example.py
    depends_on:
      - db_default
      - db_subject_management
      - ldap
