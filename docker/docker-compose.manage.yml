version: '2'

# run with 'p <service>'
# for more information see https://docs.docker.com/compose/extends/#administrative-tasks
services:
    migrate_default:
        build:
            context: ..
            dockerfile: ./docker/castellum/Dockerfile
        environment:
            DJANGO_SETTINGS_MODULE: castellum.settings.deployment
        command: "python3 manage.py migrate"
        volumes:
            - ./deployment/settings.py:/code/castellum/settings/deployment.py
        depends_on:
            - db_default

    migrate_subject_management:
        build:
            context: ..
            dockerfile: ./docker/castellum/Dockerfile
        environment:
            DJANGO_SETTINGS_MODULE: castellum.settings.deployment
        command: "python3 manage.py migrate --database=subject_management"
        volumes:
            - ./deployment/settings.py:/code/castellum/settings/deployment.py
        depends_on:
            - db_subject_management

    createsuperuser:
        build:
            context: ..
            dockerfile: ./docker/castellum/Dockerfile
        environment:
            DJANGO_SETTINGS_MODULE: castellum.settings.deployment
        volumes:
            - ./deployment/settings.py:/code/castellum/settings/deployment.py
        command: "python3 manage.py create_castellum_admin"
        depends_on:
            - db_default

    populate:
        build:
            context: ..
            dockerfile: ./docker/castellum/Dockerfile
        environment:
            DJANGO_SETTINGS_MODULE: castellum.settings.deployment
        volumes:
            - ./deployment/settings.py:/code/castellum/settings/deployment.py
        command: "python3 manage.py populate"
        depends_on:
            - migrate_default
            - migrate_subject_management
