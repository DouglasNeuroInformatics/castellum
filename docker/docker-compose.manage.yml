version: '2'

# run with 'docker-compose -f docker-compose.yml -f docker-compose.manage.yml up <service>'
# for more information see https://docs.docker.com/compose/extends/#administrative-tasks
services:
    migrate_default:
        build:
            context: ..
            dockerfile: ./docker/castellum/Dockerfile
        environment:
            DJANGO_SETTINGS_MODULE: castellum.settings.deployment
        command: "python3 manage.py migrate"
        volumes:
            - ./deployment/settings.py:/code/castellum/settings/deployment.py
        depends_on:
            - db_default

    migrate_contacts:
        build:
            context: ..
            dockerfile: ./docker/castellum/Dockerfile
        environment:
            DJANGO_SETTINGS_MODULE: castellum.settings.deployment
        command: "python3 manage.py migrate --database=contacts"
        volumes:
            - ./deployment/settings.py:/code/castellum/settings/deployment.py
        depends_on:
            - db_contacts

    createsuperuser:
        build:
            context: ..
            dockerfile: ./docker/castellum/Dockerfile
        environment:
            DJANGO_SETTINGS_MODULE: castellum.settings.deployment
        volumes:
            - ./deployment/settings.py:/code/castellum/settings/deployment.py
        command: "python3 manage.py create_castellum_admin"
        depends_on:
            - db_default

    populate:
        build:
            context: ..
            dockerfile: ./docker/castellum/Dockerfile
        environment:
            DJANGO_SETTINGS_MODULE: castellum.settings.deployment
        volumes:
            - ./deployment/settings.py:/code/castellum/settings/deployment.py
        command: "/bin/sh -c 'python3 manage.py loaddata timeslots --database=contacts && python3 manage.py populate'"
        depends_on:
            - migrate_default
            - migrate_contacts
