version: '2'

services:
  db_default:
    image: postgres
  db_contacts:
    image: postgres
  ldap:
    container_name: ldap
    image: osixia/openldap
    ports:
      - "389:389"
    command: [--copy-service]
    volumes:
      - ./dummy_data.ldif:/container/service/slapd/assets/config/bootstrap/ldif/data.ldif
  web:
    image: registry.git.mpib-berlin.mpg.de/castellum/castellum:latest
    environment:
      DJANGO_SETTINGS_MODULE: castellum.settings.deployment
    command: "uwsgi uwsgi.ini --die-on-term"
    ports:
      - "8000:8000"
    volumes:
      - ./settings.py:/code/castellum/settings/deployment.py
    depends_on:
      - db_default
      - db_contacts
      - ldap
