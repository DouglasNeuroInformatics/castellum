image: docker
services:
  - docker:dind
  - name: postgres:latest
    alias: db_default
  - name: postgres:latest
    alias: db_contacts

stages:
  - test
  - build
  - release
  - publish_coverage

variables:
  PYTHON_IMAGE: python:3.6
  PYTHON_IMAGE_DEPENDENCIES: "python3-dev libldap-2.4-2 libldap2-dev libsasl2-dev"
  CONTAINER_TEST_IMAGE: registry.git.mpib-berlin.mpg.de/castellum/castellum:$CI_COMMIT_REF_NAME
  CONTAINER_RELEASE_IMAGE: registry.git.mpib-berlin.mpg.de/castellum/castellum:latest
  DJANGO_SETTINGS_MODULE: "castellum.settings.gitlab"

test-branch:
  stage: test
  image: $PYTHON_IMAGE
  script:
    - apt-get update -q && apt-get install -y -qq $PYTHON_IMAGE_DEPENDENCIES
    - pip install -r requirements-dev.txt
    - pip install -e .
    - python manage.py makemigrations
    - pytest --ds=$DJANGO_SETTINGS_MODULE
    - flake8
    - isort -c
  coverage: '/TOTAL.*\s+(\d+\%)/'
  artifacts:
    paths:
      - ./htmlcov/

build:
  stage: build
  script:
    - apk update && apk add git
    - git config user.email "gitlab-ci@example.com"
    - git fetch origin master
    - git merge origin/master --no-ff
    - docker login -u gitlab-ci-token -p $CI_JOB_TOKEN registry.git.mpib-berlin.mpg.de
    - docker build -t $CONTAINER_TEST_IMAGE .
    - docker push $CONTAINER_TEST_IMAGE

release-image:
  stage: release
  script:
    - docker login -u gitlab-ci-token -p $CI_JOB_TOKEN registry.git.mpib-berlin.mpg.de
    - docker pull $CONTAINER_TEST_IMAGE
    - docker tag $CONTAINER_TEST_IMAGE $CONTAINER_RELEASE_IMAGE
    - docker push $CONTAINER_RELEASE_IMAGE
  only:
    - master

pages:
  stage: publish_coverage
  only:
    - master
  script:
    - mv ./htmlcov/ public/
  artifacts:
    paths:
      - public
    expire_in: 3 days
