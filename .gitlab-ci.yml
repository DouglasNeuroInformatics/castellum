stages:
  - test
  - push

test:
  stage: test
  image: buildpack-deps
  variables:
    DEBIAN_FRONTEND: noninteractive
    DJANGO_SETTINGS_MODULE: "castellum.settings.gitlab"
    POSTGRES_PASSWORD: "CHANGEME"
  services:
    - name: postgres:latest
      alias: db_default
    - name: postgis/postgis:latest
      alias: db_contacts
  before_script:
    - apt-get update -q && apt-get install -y -qq python3-pip hunspell hunspell-de-de gdal-bin python3-psycopg2
    - pip3 install -e .[test]
  script:
    - isort -c castellum tests
    - flake8
    - pospell -l de_DE -p .misc/spelling/de_DE.txt castellum/locale/de/LC_MESSAGES/django.po
    - django-admin makemigrations --dry-run --check --noinput
    - pytest --ds=$DJANGO_SETTINGS_MODULE
  coverage: '/TOTAL.*\s+(\d+\%)/'
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event" || ($CI_PIPELINE_SOURCE == "push" && ($CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH || $CI_COMMIT_TAG))

test-js:
  stage: test
  image: node
  script:
    - npx eslint castellum
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event" || ($CI_PIPELINE_SOURCE == "push" && ($CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH || $CI_COMMIT_TAG))
      changes:
        - castellum/**/*.js

docker:build:
  stage: test
  image:
    name: gcr.io/kaniko-project/executor:debug
    entrypoint: [""]
  script:
    - /kaniko/executor
      --context "$CI_PROJECT_DIR"
      --dockerfile "$CI_PROJECT_DIR/Dockerfile"
      --destination "$CI_REGISTRY_IMAGE:latest"
      --no-push
      --tarPath image.tar
  artifacts:
    paths:
    - image.tar
    when: on_success
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event" || ($CI_PIPELINE_SOURCE == "push" && ($CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH || $CI_COMMIT_TAG))

docker:push:
  stage: push
  image:
    name: gcr.io/go-containerregistry/crane:debug
    entrypoint: [""]
  before_script:
    - crane auth login -u $CI_REGISTRY_USER -p $CI_REGISTRY_PASSWORD $CI_REGISTRY
  script:
    - >
      if [ "$CI_COMMIT_REF_NAME" == "$CI_DEFAULT_BRANCH" ]; then
        crane push image.tar "$CI_REGISTRY_IMAGE:latest"
      fi
    - >
      if [ -n "$CI_COMMIT_TAG" ]; then
        crane push image.tar "$CI_REGISTRY_IMAGE:$CI_COMMIT_REF_NAME"
        crane push image.tar "$CI_REGISTRY_IMAGE:stable"
      fi
  rules:
    - if: $CI_PIPELINE_SOURCE == "push" && ($CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH || $CI_COMMIT_TAG)

dependabot:
  image:
    name: dependabot/dependabot-core
  variables:
    GIT_STRATEGY: none
    PROJECT_PATH: $CI_PROJECT_PATH
    GITLAB_HOSTNAME: $CI_SERVER_HOST
    GITLAB_ACCESS_TOKEN: $dependabot_token
  script:
    - git clone https://github.com/dependabot/dependabot-script.git
    - cd dependabot-script
    - bundle config set --local path "vendor"
    - bundle install --jobs 4 --retry 3
    - sed -i 's/# Get update details for the dependency \#/puts "Dep \#{dep.name} \#{dep.version}"/' generic-update-script.rb

    - export DEPENDABOT_NATIVE_HELPERS_PATH="$PWD/native-helpers"
    - export PATH="$PATH:$DEPENDABOT_NATIVE_HELPERS_PATH/python/bin"

    - mkdir -p native-helpers/python
    - cp -r $(bundle show dependabot-python)/helpers $DEPENDABOT_NATIVE_HELPERS_PATH/python/helpers
    - $DEPENDABOT_NATIVE_HELPERS_PATH/python/helpers/build $DEPENDABOT_NATIVE_HELPERS_PATH/python
    - PACKAGE_MANAGER=pip bundle exec ruby ./generic-update-script.rb

    - mkdir -p native-helpers/npm_and_yarn
    - cp -r $(bundle show dependabot-npm_and_yarn)/helpers $DEPENDABOT_NATIVE_HELPERS_PATH/npm_and_yarn/helpers
    - $DEPENDABOT_NATIVE_HELPERS_PATH/npm_and_yarn/helpers/build $DEPENDABOT_NATIVE_HELPERS_PATH/npm_and_yarn
    - PACKAGE_MANAGER=npm_and_yarn bundle exec ruby ./generic-update-script.rb

    - PACKAGE_MANAGER=docker bundle exec ruby ./generic-update-script.rb
  rules:
    - if: $CI_PIPELINE_SOURCE == "schedule"
