stages:
  - test
  - build

variables:
  DEBIAN_FRONTEND: noninteractive
  PYTHON_IMAGE_DEPENDENCIES: "python3-pip npm hunspell hunspell-de-de gdal-bin python3-psycopg2"
  CONTAINER_IMAGE: registry.git.mpib-berlin.mpg.de/castellum/castellum
  DJANGO_SETTINGS_MODULE: "castellum.settings.gitlab"
  POSTGRES_PASSWORD: "CHANGEME"

test:
  stage: test
  image: buildpack-deps
  services:
    - name: postgres:latest
      alias: db_default
    - name: postgis/postgis:latest
      alias: db_contacts
  script:
    - apt-get update -q && apt-get install -y -qq $PYTHON_IMAGE_DEPENDENCIES
    - pip3 install -e .[test]
    - npm install
    - isort -c castellum tests
    - flake8
    - npx eslint castellum
    - pospell -l de_DE -p .misc/spelling/de_DE.txt castellum/locale/de/LC_MESSAGES/django.po
    - django-admin makemigrations --dry-run --check --noinput
    - pytest --ds=$DJANGO_SETTINGS_MODULE
  coverage: '/TOTAL.*\s+(\d+\%)/'

build-release:
  stage: build
  image: docker
  services:
    - docker:dind
  script:
    - docker login -u gitlab-ci-token -p $CI_JOB_TOKEN registry.git.mpib-berlin.mpg.de
    - docker build -t ${CONTAINER_IMAGE}:$CI_COMMIT_REF_NAME
    - docker push ${CONTAINER_IMAGE}:$CI_COMMIT_REF_NAME
    - docker tag ${CONTAINER_IMAGE}:$CI_COMMIT_REF_NAME ${CONTAINER_IMAGE}:stable
    - docker push ${CONTAINER_IMAGE}:stable
  rules:
    - if: '$CI_COMMIT_TAG && $CI_COMMIT_REF_NAME =~ /^\d+.\d+.\d+$/'
      when: always

build-latest:
  stage: build
  image: docker
  services:
    - docker:dind
  script:
    - docker login -u gitlab-ci-token -p $CI_JOB_TOKEN registry.git.mpib-berlin.mpg.de
    - docker build -t $CONTAINER_IMAGE:latest
    - docker push $CONTAINER_IMAGE:latest
  rules:
    - if: '$CI_COMMIT_REF_NAME == "main"'
      when: always
