stages:
  - test
  - build
  - release

variables:
  DEBIAN_FRONTEND: noninteractive
  PYTHON_IMAGE_DEPENDENCIES: "python3-pip npm hunspell hunspell-de-de gdal-bin python3-psycopg2"
  CONTAINER_TEST_IMAGE: registry.git.mpib-berlin.mpg.de/castellum/castellum:$CI_COMMIT_REF_NAME
  CONTAINER_RELEASE_IMAGE: registry.git.mpib-berlin.mpg.de/castellum/castellum:latest
  DJANGO_SETTINGS_MODULE: "castellum.settings.gitlab"
  POSTGRES_PASSWORD: "CHANGEME"

test-branch:
  stage: test
  image: buildpack-deps
  services:
    - name: postgres:latest
      alias: db_default
    - name: postgis/postgis:latest
      alias: db_contacts
  script:
    - apt-get update -q && apt-get install -y -qq $PYTHON_IMAGE_DEPENDENCIES
    - pip3 install -e .[test]
    - npm install
    - isort -c castellum tests
    - flake8
    - npx eslint castellum
    - pospell -l de_DE -p .misc/spelling/de_DE.txt castellum/locale/de/LC_MESSAGES/django.po
    - django-admin makemigrations --dry-run --check --noinput
    - pytest --ds=$DJANGO_SETTINGS_MODULE
  coverage: '/TOTAL.*\s+(\d+\%)/'

build:
  stage: build
  image: docker
  services:
    - docker:dind
  artifacts:
    paths:
      - image.tar.gz
  script:
    - docker login -u gitlab-ci-token -p $CI_JOB_TOKEN registry.git.mpib-berlin.mpg.de
    - docker build -t $CONTAINER_TEST_IMAGE .
    - docker image ls
  after_script:
    - docker save $CONTAINER_TEST_IMAGE | gzip > image.tar.gz

release-image:
  stage: release
  image: docker
  services:
    - docker:dind
  before_script:
    - docker load --input image.tar.gz
  script:
    - docker login -u gitlab-ci-token -p $CI_JOB_TOKEN registry.git.mpib-berlin.mpg.de
    - docker tag $CONTAINER_TEST_IMAGE $CONTAINER_RELEASE_IMAGE
    - docker push $CONTAINER_RELEASE_IMAGE
  only:
    - main
