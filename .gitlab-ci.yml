stages:
  - test
  - push
  - deploy

workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - if: $CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_TAG

test:
  stage: test
  image: buildpack-deps:bookworm
  variables:
    DEBIAN_FRONTEND: noninteractive
    DJANGO_SETTINGS_MODULE: "castellum.settings.gitlab"
    POSTGRES_PASSWORD: "CHANGEME"
  services:
    - name: postgres:latest
      alias: db_default
    - name: postgis/postgis:latest
      alias: db_contacts
  before_script:
    - apt-get update -q && apt-get install -y -qq python3-pip python3-venv hunspell hunspell-de-de gdal-bin python3-psycopg2
    - python3 -m venv .venv --system-site-packages
    - .venv/bin/pip install -e .[test]
  script:
    - .venv/bin/isort -c castellum tests
    - .venv/bin/flake8
    - .venv/bin/pospell -l de_DE -p .misc/spelling/de_DE.txt castellum/locale/de/LC_MESSAGES/django.po
    - .venv/bin/django-admin makemigrations --dry-run --check --noinput
    - .venv/bin/pytest --ds=$DJANGO_SETTINGS_MODULE
  coverage: '/TOTAL.*\s+(\d+\%)/'

test-js:
  stage: test
  image: node
  script:
    - npx eslint castellum
  rules:
    - changes:
        - castellum/**/*.js

docker:build:
  stage: test
  image:
    name: gcr.io/kaniko-project/executor:debug
    entrypoint: [""]
  script:
    - /kaniko/executor
      --context "$CI_PROJECT_DIR"
      --dockerfile "$CI_PROJECT_DIR/Dockerfile"
      --destination "$CI_REGISTRY_IMAGE:latest"
      --no-push
      --tarPath image.tar
  artifacts:
    paths:
    - image.tar
    when: on_success
    expire_in: 1 day

docker:push:
  stage: push
  image:
    name: gcr.io/go-containerregistry/crane:debug
    entrypoint: [""]
  before_script:
    - crane auth login -u $CI_REGISTRY_USER -p $CI_REGISTRY_PASSWORD $CI_REGISTRY
  script:
    - >
      if [ "$CI_COMMIT_REF_NAME" == "$CI_DEFAULT_BRANCH" ]; then
        crane push image.tar "$CI_REGISTRY_IMAGE:latest"
      fi
    - >
      if [ -n "$CI_COMMIT_TAG" ]; then
        crane push image.tar "$CI_REGISTRY_IMAGE:$CI_COMMIT_REF_NAME"
        if ! echo "$CI_COMMIT_TAG" | grep -q "b"; then
          crane push image.tar "$CI_REGISTRY_IMAGE:stable"
        fi
      fi
  rules:
    - if: $CI_COMMIT_REF_NAME == $CI_DEFAULT_BRANCH
    - if: $CI_COMMIT_TAG

deploy:
  image:
    name: bitnami/kubectl
    entrypoint: [""]
  stage: deploy
  before_script:
    - kubectl config set-cluster default --server=https://prod.rancher.gwdg.de/k8s/clusters/c-69w57
    - kubectl config set-credentials default --token="$K8S_TOKEN"
    - kubectl config set-context default --cluster=default --user=default --namespace=castellum
    - kubectl config use-context default
  script:
    - kubectl rollout restart deployment/castellum-stage
  rules:
    - if: $CI_COMMIT_REF_NAME == $CI_DEFAULT_BRANCH && $K8S_TOKEN
