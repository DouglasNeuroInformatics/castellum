image: docker
services:
  - docker:dind

stages:
  - test
  - build
  - release

variables:
  PYTHON_IMAGE: python:3.6
  PYTHON_IMAGE_DEPENDENCIES: "npm hunspell hunspell-de-de gdal-bin"
  CONTAINER_TEST_IMAGE: registry.git.mpib-berlin.mpg.de/castellum/castellum:$CI_COMMIT_REF_NAME
  CONTAINER_RELEASE_IMAGE: registry.git.mpib-berlin.mpg.de/castellum/castellum:latest
  DJANGO_SETTINGS_MODULE: "castellum.settings.gitlab"

test-branch:
  stage: test
  image: $PYTHON_IMAGE
  script:
    - apt-get update -q && apt-get install -y -qq $PYTHON_IMAGE_DEPENDENCIES
    - pip install -r requirements-dev.txt
    - pip install -e .
    - npm install
    - pytest --ds=$DJANGO_SETTINGS_MODULE
    - flake8
    - isort -c castellum tests
    - npx eslint castellum
    - pospell -l de_DE -p .spelling/de_DE.txt castellum/locale/de/LC_MESSAGES/django.po
    - python manage.py makemigrations --dry-run --check --noinput
  coverage: '/TOTAL.*\s+(\d+\%)/'

build:
  stage: build
  script:
    - docker login -u gitlab-ci-token -p $CI_JOB_TOKEN registry.git.mpib-berlin.mpg.de
    - docker build -t $CONTAINER_TEST_IMAGE .
    - docker push $CONTAINER_TEST_IMAGE

release-image:
  stage: release
  script:
    - docker login -u gitlab-ci-token -p $CI_JOB_TOKEN registry.git.mpib-berlin.mpg.de
    - docker pull $CONTAINER_TEST_IMAGE
    - docker tag $CONTAINER_TEST_IMAGE $CONTAINER_RELEASE_IMAGE
    - docker push $CONTAINER_RELEASE_IMAGE
  only:
    - main
