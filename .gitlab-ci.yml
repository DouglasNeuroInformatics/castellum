stages:
  - test
  - build

workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

test:
  stage: test
  image: buildpack-deps
  variables:
    DEBIAN_FRONTEND: noninteractive
    DJANGO_SETTINGS_MODULE: "castellum.settings.gitlab"
    POSTGRES_PASSWORD: "CHANGEME"
  services:
    - name: postgres:latest
      alias: db_default
    - name: postgis/postgis:latest
      alias: db_contacts
  before_script:
    - apt-get update -q && apt-get install -y -qq python3-pip hunspell hunspell-de-de gdal-bin python3-psycopg2
    - pip3 install -e .[test]
  script:
    - isort -c castellum tests
    - flake8
    - pospell -l de_DE -p .misc/spelling/de_DE.txt castellum/locale/de/LC_MESSAGES/django.po
    - django-admin makemigrations --dry-run --check --noinput
    - pytest --ds=$DJANGO_SETTINGS_MODULE
  coverage: '/TOTAL.*\s+(\d+\%)/'

test-js:
  stage: test
  image: node
  script:
    - npx eslint castellum
  rules:
    - changes:
        - castellum/**/*.js

test-docs:
  stage: test
  image: alpine
  script:
    - apk --no-cache add python3 py3-pip
    - pip3 install sphinx sphinx-rtd-theme
    - sphinx-build -W -b html docs/source docs/build/html/en
    - sphinx-build -b html docs/source docs/build/html/en
    - sphinx-build -b html -D language=de docs/source docs/build/html/de
  rules:
    - changes:
        - docs/**/*

build:
  stage: build
  image: docker
  variables:
    CONTAINER_IMAGE: registry.git.mpib-berlin.mpg.de/castellum/castellum
  services:
    - docker:dind
  before_script:
    - docker login -u gitlab-ci-token -p $CI_JOB_TOKEN registry.git.mpib-berlin.mpg.de
    - docker pull $CONTAINER_IMAGE:latest || true
  script:
    - docker build --cache-from $CONTAINER_IMAGE:latest -t $CONTAINER_IMAGE:$CI_COMMIT_REF_NAME .
  after_script:
    - >
      if [ "$CI_COMMIT_REF_NAME" == "$CI_DEFAULT_BRANCH" ]; then
        docker tag $CONTAINER_IMAGE:$CI_COMMIT_REF_NAME $CONTAINER_IMAGE:latest
        docker push $CONTAINER_IMAGE:latest
      fi
    - >
      if [ -n "$CI_COMMIT_TAG" ]; then
        docker tag $CONTAINER_IMAGE:$CI_COMMIT_REF_NAME $CONTAINER_IMAGE:stable
        docker push $CONTAINER_IMAGE:$CI_COMMIT_REF_NAME
        docker push $CONTAINER_IMAGE:stable
      fi

publish-docs:
  stage: build
  dependencies:
    - test-docs
  script:
    - mv docs/build/html/ public/
    - mv docs/source/_static/redirect/index.html public/index.html
  rules:
    - if: $CI_COMMIT_REF_NAME == $CI_DEFAULT_BRANCH
  artifacts:
    paths:
      - public
