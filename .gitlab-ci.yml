stages:
  - test
  - push
  - deploy

workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - if: $CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_TAG

test:
  stage: test
  image: ghcr.io/astral-sh/uv:trixie-slim
  variables:
    DEBIAN_FRONTEND: noninteractive
    DJANGO_SETTINGS_MODULE: "castellum.settings.gitlab"
    POSTGRES_PASSWORD: "CHANGEME"
  services:
    - name: postgres:latest
      alias: db_default
    - name: postgis/postgis:latest
      alias: db_contacts
  before_script:
    - apt-get update -q && apt-get install -y --no-install-recommends -qq hunspell hunspell-de-de gdal-bin
    - uv venv .venv
    - uv pip install -e .[test] psycopg2-binary
  script:
    - .venv/bin/ruff check castellum tests
    - .venv/bin/python .misc/check_spelling.py
    - .venv/bin/python -m django makemigrations --dry-run --check --noinput
    - .venv/bin/pytest --ds=$DJANGO_SETTINGS_MODULE
  coverage: '/TOTAL.*\s+(\d+\%)/'

test-py310:
  extends: test
  variables:
    UV_PYTHON: '3.10'

docker:test:
  stage: test
  image:
    name: quay.io/buildah/stable
  script:
    - buildah build
      --tag "$CI_REGISTRY_IMAGE:latest"
      --layers
      --cache-to "$CI_REGISTRY_IMAGE/cache"
      --cache-from "$CI_REGISTRY_IMAGE/cache"

docker:
  stage: push
  image:
    name: quay.io/buildah/stable
  script:
    - buildah login -u "$CI_REGISTRY_USER" --password "$CI_REGISTRY_PASSWORD" "$CI_REGISTRY"
    - buildah build \
      --tag "$CI_REGISTRY_IMAGE:latest" \
      --layers \
      --cache-to "$CI_REGISTRY_IMAGE/cache" \
      --cache-from "$CI_REGISTRY_IMAGE/cache"
    - >
      if [ "$CI_COMMIT_REF_NAME" = "$CI_DEFAULT_BRANCH" ]; then
        buildah push "$CI_REGISTRY_IMAGE:latest" "docker://$CI_REGISTRY_IMAGE:latest"
      fi
    - >
      if [ -n "$CI_COMMIT_TAG" ]; then
        buildah push "$CI_REGISTRY_IMAGE:latest" "docker://$CI_REGISTRY_IMAGE:$CI_COMMIT_TAG"
      fi
    - >
      if [ -n "$CI_COMMIT_TAG" ] && ! echo "$CI_COMMIT_TAG" | grep -q "b"; then
        buildah push "$CI_REGISTRY_IMAGE:latest" "docker://$CI_REGISTRY_IMAGE:stable"
      fi
  rules:
    - if: $CI_COMMIT_REF_NAME == $CI_DEFAULT_BRANCH
    - if: $CI_COMMIT_TAG

docs:test:
  stage: test
  image: ghcr.io/astral-sh/uv:trixie-slim
  before_script:
    - uv venv .venv
    - uv pip install sphinx sphinx-rtd-theme
  script:
    - .venv/bin/sphinx-build -W -b html docs/usage/ docs_html

pages:
  stage: push
  image: ghcr.io/astral-sh/uv:trixie-slim
  before_script:
    - uv venv .venv
    - uv pip install sphinx sphinx-rtd-theme
  script:
    - .venv/bin/sphinx-build -b html docs/usage/ public/docs/
  artifacts:
    paths:
      - public
    expire_in: 1 month
  rules:
    - if: $CI_COMMIT_REF_NAME == $CI_DEFAULT_BRANCH

deploy:demo:
  image: buildpack-deps:trixie
  stage: deploy
  script:
    - 'curl https://castellum-demo.mpib-berlin.mpg.de/d4f66ab1-75f6-48cc-8a67-c9b031330f22 -X POST -H "Authorization: Bearer $DEMO_TOKEN"'
  rules:
    - if: $CI_COMMIT_REF_NAME == $CI_DEFAULT_BRANCH && $DEMO_TOKEN
