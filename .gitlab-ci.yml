image: alpine

pages:
  script:
  - apk --no-cache add python3-dev
  - pip3 install sphinx
  - apk --no-cache add make
  - sphinx-build -b html source build/html/en
  - sphinx-build -b html -D language=de source build/html/de
  - mv build/html/ public/
  artifacts:
    paths:
    - public
  only:
  - master
