version: '2'

services:
  db:
    image: postgres
  ldap:
    container_name: ldap
    image: osixia/openldap
    ports:
      - "389:389"
    command: [--copy-service]
    volumes:
      - ./stage/dummy_data.ldif:/container/service/slapd/assets/config/bootstrap/ldif/data.ldif
  web:
    build: castellum_core
    environment:
      DJANGO_SETTINGS_MODULE: castellum_core.settings.stage
    command: >
      sh -c "cd castellum_core &&
      make bootstrap &&
      python castellum_core/manage.py collectstatic --no-input &&
      uwsgi uwsgi.ini"
    volumes:
      - .:/code
      - static-content:/code/castellum_core/castellum_core/staticserve
    depends_on:
      - db
      - ldap
  nginx:
    image: nginx
    volumes:
      - ./stage/nginx.conf:/etc/nginx/conf.d/default.conf
      - static-content:/static
    ports:
      - "8000:80"
    depends_on:
      - web

volumes:
  static-content:
