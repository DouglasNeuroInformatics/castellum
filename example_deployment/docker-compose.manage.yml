version: '2'

# run with 'docker-compose -f docker-compose.yml -f docker-compose.manage.yml up <service>'
# for more information see https://docs.docker.com/compose/extends/#administrative-tasks
services:
    migrate:
        image: registry.git.mpib-berlin.mpg.de/castellum/castellum:latest
        environment:
            DJANGO_SETTINGS_MODULE: castellum_core.settings.example
        command: >
            sh -c "
            python3 castellum_core/manage.py migrate &&
            python3 castellum_core/manage.py migrate --database=subject_management"
        volumes:
            - ./settings.py:/code/castellum_core/castellum_core/settings/example.py
        depends_on:
            - db_default
            - db_subject_management

    createsuperuser:
        image: registry.git.mpib-berlin.mpg.de/castellum/castellum:latest
        environment:
            DJANGO_SETTINGS_MODULE: castellum_core.settings.example
        volumes:
            - ./settings.py:/code/castellum_core/castellum_core/settings/example.py
        command: "python3 castellum_core/manage.py create_castellum_admin"
        depends_on:
            - db_default
