[tox]
envlist = py35,flake8,isort


[pytest]
addopts =
    --ds=castellum_core.settings
    --cov=castellum_core
    --cov-branch
    --cov-report term-missing:skip-covered
    --cov-report html
    --cov-fail-under=80


[flake8]
exclude=
    .git,
    .env,
    .tox,
    node_modules,
    wsgi.py,
    migrations,
    settings,
max-line-length=100


[isort]
known_django=django
sections=STDLIB,DJANGO,THIRDPARTY,FIRSTPARTY,LOCALFOLDER
force_single_line=True
skip=migrations,settings
not_skip=__init__.py


[testenv]
deps =
    pytest-django
    pytest-cov
    freezegun
    model_mommy
setenv =
    PYTHONPATH = {toxinidir}/castellum_core:{env:PYTHONPATH:}
commands =
    pytest tests/


[testenv:flake8]
deps = flake8
commands = flake8


[testenv:isort]
deps = isort
commands = isort -c -rc castellum_core


[coverage:report]
omit=
    */migrations/*
    */wsgi.py
    */manage.py
