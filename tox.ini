[tox]
envlist = py36,flake8,isort


[pytest]
addopts =
    --ds=castellum.settings
    --cov=castellum
    --cov-branch
    --cov-report term-missing:skip-covered
    --cov-report html
    --cov-fail-under=80
    --strict-markers
    --fail-on-template-vars
markers =
    freeze_time: decorator from freezegun package
    unittest: marks tests as fast. They test only one function and don't need access to the database


[flake8]
exclude=
    .git,
    .venv,
    .tox,
    node_modules,
    wsgi.py,
    migrations,
    docs,
    settings,
max-line-length=100


[isort]
known_django=django
known_third_party=cologne_phonetics
sections=STDLIB,DJANGO,THIRDPARTY,FIRSTPARTY,LOCALFOLDER
force_single_line=True
skip=migrations,settings
not_skip=__init__.py


[testenv]
deps =
    pytest
    pytest-django
    pytest-cov
    pytest-freezegun
    model_mommy
    lxml
setenv =
    PYTHONPATH = {toxinidir}/castellum:{env:PYTHONPATH:}
passenv = DJANGO_*
commands =
    pytest {posargs} tests/ --ds={env:DJANGO_SETTINGS_MODULE:castellum.settings}


[testenv:flake8]
deps = flake8
commands = flake8


[testenv:isort]
deps = isort == 4.3.9
commands = isort -c -rc castellum


[coverage:report]
omit=
    */migrations/*
    */wsgi.py
    */manage.py
