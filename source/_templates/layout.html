{% extends "!layout.html" %}
{% block sidebar1 %}
    <div>
        <button onclick="switchLanguage('{{ language }}', 'en')" {{ 'disabled' if language is eq 'en' }}>en</button>    
        <button onclick="switchLanguage('{{ language }}', 'de')" {{ 'disabled' if language is eq 'de' }}>de</button>
    </div>
    {{ super() }}
{% endblock %}
