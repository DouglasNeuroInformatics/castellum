version: "3.0"

services:
  db_wait:
    image: postgres
    depends_on:
      - db_default
      - db_contacts
    command: ["sh", "-c", "until pg_isready -h db_default && pg_isready -h db_contacts; do sleep 1; done"]
    environment:
      PGPORT: "5432"
      PGUSER: "postgres"
      PGPASSWORD: "CHANGEME"
  db_default:
    image: postgres
    restart: always
    environment:
      POSTGRES_PASSWORD: "CHANGEME"
  db_contacts:
    image: postgis/postgis
    restart: always
    environment:
      POSTGRES_PASSWORD: "CHANGEME"
  ldap:
    image: osixia/openldap
    restart: always
    ports:
      - "389:389"
    command: [--copy-service]
    volumes:
      - ./dummy_data.ldif:/container/service/slapd/assets/config/bootstrap/ldif/data.ldif:ro
  nominatim:
    image: mediagis/nominatim:3.4
    volumes:
      - ./nominatim:/data
      - ./nominatim/postgresdata:/var/lib/postgresql/11/main
      - ./nominatim/local.php:/app/src/build/settings/local.php
    command: ["bash", "/app/start.sh"]
  web:
    ## use the latest pre-built image
    image: registry.git.mpib-berlin.mpg.de/castellum/castellum:latest
    restart: always
    ## use the local copy
    # build: ../../
    environment:
      DJANGO_SETTINGS_MODULE: castellum.settings.deployment
    command: "uwsgi uwsgi.ini --die-on-term"
    ports:
      - "8000:8000"
    volumes:
      - ./settings.py:/code/castellum/settings/deployment.py:ro
      - ./uwsgi.ini:/code/uwsgi.ini:ro
    depends_on:
      - db_default
      - db_contacts
      - ldap
      - nominatim
  cron:
    image: registry.git.mpib-berlin.mpg.de/castellum/castellum:latest
    restart: always
    environment:
      DJANGO_SETTINGS_MODULE: castellum.settings.deployment
    command: busybox crond -f -L /log/cron.log
    volumes:
      - ./settings.py:/code/castellum/settings/deployment.py:ro
      - ./crontab:/etc/crontabs/root:ro
    depends_on:
      - db_default
      - db_contacts
