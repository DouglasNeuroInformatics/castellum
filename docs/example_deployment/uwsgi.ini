[uwsgi]
master=true
chdir=/code
uid=uwsgi
threads=4
disable-logging=True
cron2 = minute=0,hour=1 django-admin clearsessions
cron2 = minute=0,hour=1 django-admin cleanup_media
cron2 = minute=0,hour=1 django-admin notify_to_be_deleted http://example.com
cron2 = minute=0,hour=1 django-admin send_appointment_reminders http://example.com
cron2 = minute=0,hour=1 django-admin notify_sessions_end
cron2 = minute=0,hour=1,week=1 django-admin geocode_all

socket=0.0.0.0:8000
# enables internal http server and router
protocol=http
static-map=/static=/code/castellum/collected_static
static-map=/favicon.ico=/code/castellum/collected_static/images/favicon.ico

# https://uwsgi-docs.readthedocs.io/en/latest/Snippets.html#x-sendfile-emulation
plugins = router_static
offload-threads = 2
static-safe = /media
collect-header = X-Sendfile X_SENDFILE
response-route-if-not = empty:${X_SENDFILE} static:${X_SENDFILE}

wsgi-file=castellum/wsgi.py
plugin=python
