server {
    listen 80;
    server_name castellum.mydomain.org; # CHANGEME
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name castellum.mydomain.org; # CHANGEME
    root /opt/castellum;

    # CHANGEME: Include actual SSL cert files
    ssl_certificate        /etc/castellum/castellum.mydomain.org.pem;
    ssl_certificate_key	   /etc/castellum/castellum.mydomain.org.key;
    ssl_client_certificate	/etc/pki/tls/certs/ca-bundle.crt;
    proxy_ssl_trusted_certificate	/etc/pki/tls/certs/ca-bundle.trust.crt;

    # # Use, e.g., the Mozilla config generator https://ssl-config.mozilla.org/ for specific options
    # ssl_protocols ...
    # ssl_ciphers ...

    access_log off;
    error_log /var/log/castellum_error.log;

    location / {
        proxy_pass http://unix:/run/gunicorn.sock;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 90;
    }

    location = /favicon.ico {
    	root /opt/castellum/castellum/collected_static/images;
    }

    location /static/  {
    	alias /opt/castellum/castellum/collected_static/;
    }

    location /protected/  {
        internal;
        alias /media/;
    }

}
