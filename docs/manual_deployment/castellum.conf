server {
    listen 80;
    server_name castellum.mydomain.org; # CHANGEME
    rewrite ^ https://$host$request_uri permanent;
    root /opt/castellum;
}

server {
    listen 443 ssl;
    server_name castellum.mydomain.org; # CHANGEME
    root /opt/castellum;

    # CHANGEME: Include actual SSL cert files
    ssl_certificate        /etc/castellum/castellum.mydomain.org.pem;
    ssl_certificate_key	   /etc/castellum/castellum.mydomain.org.key;
    ssl_client_certificate	/etc/pki/tls/certs/ca-bundle.crt;
    proxy_ssl_trusted_certificate	/etc/pki/tls/certs/ca-bundle.trust.crt;
    ssl_verify_client      optional;
    ssl_protocols TLSv1 TLSv1.1 TLSv1.2;
    ssl_ciphers HIGH:!aNULL:!eNULL:!EXPORT:!CAMELLIA:!DES:!MD5:!PSK:!RC4;

    access_log /dev/null;
    error_log /var/log/castellum_error.log;

    location / {
        proxy_pass http://unix:/run/gunicorn.sock;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 90;
    }

    location /favicon.ico {
    	root /opt/castellum/castellum/collected_static/images;
    }

    location /static/  {
    	alias /opt/castellum/castellum/collected_static/;
    }

    location /media/  {
    }

}
