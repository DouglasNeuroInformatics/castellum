services:
  db_default:
    image: postgres
    restart: unless-stopped
    environment:
      POSTGRES_PASSWORD: "CHANGEME"
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "postgres"]
      start_period: 30s
      start_interval: 1s
  db_contacts:
    image: postgis/postgis
    restart: unless-stopped
    environment:
      POSTGRES_PASSWORD: "CHANGEME"
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "postgres"]
      start_period: 30s
      start_interval: 1s
  db_scheduler:
    image: postgres
    restart: unless-stopped
    environment:
      POSTGRES_PASSWORD: "CHANGEME"
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "postgres"]
      start_period: 30s
      start_interval: 1s
  ldap:
    image: osixia/openldap
    restart: unless-stopped
    command: [--copy-service]
    environment:
      LDAP_PORT: 3389
    volumes:
      - ./dummy_data.ldif:/container/service/slapd/assets/config/bootstrap/ldif/data.ldif:ro
  nominatim:
    image: mediagis/nominatim:3.4
    restart: unless-stopped
    volumes:
      - ./nominatim:/data
      - ./nominatim/postgresdata:/var/lib/postgresql/11/main
      - ./nominatim/local.php:/app/src/build/settings/local.php
    command: ["bash", "/app/start.sh"]
  scheduler:
    image: registry.git.mpib-berlin.mpg.de/castellum/castellum_scheduler:latest
    restart: unless-stopped
    ports:
      - "8001:8000"
    volumes:
      - ./scheduler_settings.py:/app/django_settings.py:ro
    depends_on:
      db_scheduler:
        condition: service_healthy
      ldap:
        condition: service_started
  web:
    ## use the latest pre-built image
    image: registry.git.mpib-berlin.mpg.de/castellum/castellum:latest
    ## use the local copy
    # build: ../../
    restart: unless-stopped
    environment:
      CASTELLUM_SCHEDULER_URL:
    ports:
      - "8000:8000"
    volumes:
      - ./settings.py:/app/django_settings.py:ro
    depends_on:
      db_default:
        condition: service_healthy
      db_contacts:
        condition: service_healthy
      ldap:
        condition: service_started
      nominatim:
        condition: service_started
  cron:
    image: registry.git.mpib-berlin.mpg.de/castellum/castellum:latest
    restart: unless-stopped
    command: crond -f -L /app/log/cron.log
    volumes:
      - ./settings.py:/app/django_settings.py:ro
      - ./crontab:/etc/crontabs/root:ro
    depends_on:
      db_default:
        condition: service_healthy
      db_contacts:
        condition: service_healthy
  static:
    # /var/www/castellum/static must be writeable by the docker container
    image: registry.git.mpib-berlin.mpg.de/castellum/castellum:latest
    command: sh -c 'rm -rf host_static/* && cp -r static/* host_static/'
    volumes:
      - /var/www/castellum/static:/app/host_static
