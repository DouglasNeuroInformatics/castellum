{% load i18n %}

<ul class="table-list">
    {% for subject in subjects %}
        <li class="table-list-item">
            {{ subject.contact }}
            <div class="table-list-item-actions">
                <a class="btn btn-outline-primary" href="{% url 'subjects:detail' subject.pk %}">{% trans 'Details' %}</a>
            </div>
        </li>
    {% empty %}
        <li class="alert alert-success">{% trans 'Nothing to do' %}</li>
    {% endfor %}
    {% if missing > 0 %}
        <li class="table-list-item text-muted">
            {% blocktrans %}… and {{ missing }} further entries{% endblocktrans %}
        </li>
    {% endif %}
</ul>
