{% extends "studies/base.html" %}
{% load utils %}

{% block title %}{{ study }} &middot; {{ block.super }}{% endblock %}

{% block header %}
    <div class="d-flex flex-column flex-md-row justify-content-between mb-3">
        <div>
            <h1>{{ study }}</h1>
            <p>{{ study|verbose_name:'contact_person' }}: {{ study.contact_person }}</p>
        </div>
        {% block header_actions %}{% endblock %}
    </div>
{% endblock %}
