{% extends "studies/study_base.html" %}
{% load i18n utils %}

{% block content_with_messages %}
    <div class="row">
        <div class="col-md-3">
            <div class="list-group mb-3">
                {% for g in study.studygroup_set.all %}
                    <a class="list-group-item list-group-item-custom list-group-item-action {% if g == group %}active{% endif %}" href="{% url 'studies:group' study.pk g.pk %}">{{ g|display:'name' }}</a>
                {% endfor %}
            </div>

            {% if not readonly %}
                <div class="list-group mb-3">
                    <a class="list-group-item list-group-item-custom list-group-item-action {% if not group %}active{% endif %}" href="{% url 'studies:group-create' study.pk %}">{% trans 'Add new' %}</a>
                </div>
            {% endif %}
        </div>

        <div class="col-md-9">
            {{ block.super }}
        </div>
    </div>
{% endblock %}
