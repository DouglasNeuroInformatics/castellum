{% extends "execution/base.html" %}
{% load i18n bootstrap4 %}

{% block title %}{{ study }} &middot; {{ block.super }}{% endblock %}

{% block content %}
    <h1 class="text-center">{{ study }}</h1>

    <form method="post">
        {% for error in form.non_field_errors %}
            <p class="alert alert-danger" role="alert">{{ error }}</p>
        {% endfor %}

        {% csrf_token %}
        {% bootstrap_field form.pseudonym %}

        <div class="d-print-none mb-3">
            <button class="btn btn-primary">{% trans 'Submit' %}</button>
        </div>
    </form>
{% endblock %}
