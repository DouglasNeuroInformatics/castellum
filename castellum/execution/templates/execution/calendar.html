{% extends "execution/study_base.html" %}
{% load static %}

{% block container_class %}container-lg{% endblock%}

{% block content %}
    <div class="my-5" data-js="calendar"></div>
{% endblock %}

{% block extra_scripts %}
    <script src="{% static 'fullcalendar/all/global.js' %}"></script>
    <script src="{% static 'fullcalendar-scheduler/all/global.js' %}"></script>
    <script src="{% static 'fullcalendar/locales/de/global.js' %}"></script>
    <script src="{% static '@fullcalendar/bootstrap5/global.js' %}"></script>
    <script type="module" src="{% static 'js/calendar.js' %}"></script>
{% endblock %}

{% block extra_styles %}
    <link rel="stylesheet" href="{% static 'fullcalendar/skeleton.css' %}">
    <link rel="stylesheet" href="{% static '@fullcalendar/bootstrap5/theme.css' %}">
{% endblock %}
