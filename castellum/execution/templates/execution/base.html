{% extends "base.html" %}

{% load i18n %}

{% block breadcrumbs %}
    <li class="breadcrumb-item"><a href="{% url 'execution:index' %}">{% trans "Execution" %}</a></li>
    {% if study %}
        <li class="breadcrumb-item"><a href="{% url 'execution:study-detail' study.pk %}">{{ study.name }}</a></li>
    {% endif %}
    {% if participationrequest %}
        <li class="breadcrumb-item"><a href="{% url 'execution:participationrequest-detail' study.pk participationrequest.pk %}">{{ participationrequest.subject.contact.short_name }}</a></li>
    {% endif %}
{% endblock %}
