{% extends "execution/base.html" %}
{% load i18n %}

{% block title %}{{ object.study }} &middot; {{ block.super }}{% endblock %}

{% block content %}
    <h1>{{ object.study }} &mdash; {{ object.subject.contact.full_name }}</h1>

    <dl>
        <dt>{% trans 'Pseudonym' %}</dt>
        <dd>{{ object.pseudonym }}</dd>
    </dl>

    <div class="mb-3">
        <a href="{% url 'execution:study-detail' object.study.pk %}" class="btn btn-outline-primary">{% trans 'Back' %}</a>
    </div>
{% endblock %}
