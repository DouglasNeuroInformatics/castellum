{% load i18n %}

<div class="form-row">

        <div class="col-sm mb-2">{% include widget.template_name %}</div>
    {% endfor %}
    <div class="col-sm flex-grow-0 mb-2">
        <button class="btn btn-danger" type="button" data-js="clear-datetime">{% translate 'Clear' %}</button>
    </div>
</div>
