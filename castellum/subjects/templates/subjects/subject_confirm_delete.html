{% extends "subjects/subject_base.html" %}
{% load i18n %}

{% block title %}{% trans "Delete subject" %} &middot; {{ block.super }}{% endblock %}

{% block content %}
    <form method="post">
        {% csrf_token %}
        <p>{% trans "Are you sure you want to delete this subject and all related data?" %}</p>
        <div class="mb-3">
            <a href="{% url 'subjects:detail' object.pk %}" class="btn btn-outline-primary">{% trans 'Back' %}</a>
            <input type="submit" class="btn btn-danger" value="{% trans 'Confirm' %}" />
        </div>
    </form>
{% endblock %}
