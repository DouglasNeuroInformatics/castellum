{% extends "subjects/blocklist_base.html" %}
{% load i18n django_bootstrap5 %}

{% block content %}
    <form method="post" enctype="multipart/form-data">
        {% csrf_token %}
        {% bootstrap_field form.file %}

        <div class="d-print-none mb-3">
            <button class="btn btn-primary mb-1">{% translate 'Check' %}</button>
            <a href="{% url 'subjects:blocklist' %}" class="btn btn-outline-primary mb-1" data-js="cancel">{% translate 'Single Mode' %}</a>
        </div>
    </form>
{% endblock %}
