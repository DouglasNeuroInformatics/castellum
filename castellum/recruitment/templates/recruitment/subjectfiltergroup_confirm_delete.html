{% extends "base.html" %}
{% load i18n %}

{% block title %}{% trans "Delete Filter Group" %} &middot; {{ block.super }}{% endblock %}

{% block content %}
    <form method="post">
        {% csrf_token %}
        <p>{% trans "Are you sure you want to delete this filter group and all of its filters?" %}</p>
        <div class="mb-3">
            <input type="submit" class="btn btn-danger" value="{% trans 'Confirm' %}" />
            <a href="{% url 'recruitment:filtergroup_update' object.study.pk object.pk %}" class="btn btn-light">{% trans 'Back' %}</a>
        </div>
    </form>
{% endblock %}
