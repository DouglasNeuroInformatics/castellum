{% load i18n %}

<table class="table mt-3">
    <thead>
        <tr>
            <th>{% trans 'Pseudonym' %}</th>
            <th>{% trans 'Gender' %}</th>
            <th>{% trans 'Age' %}</th>
            <th>{% trans 'Action' %}</th>
        </tr>
    </thead>
    <tbody>
        {% for participation, contact in participations_list %}
        <tr>
            <td>{{ participation.pseudonym|truncatechars:11 }}</td>
            <td>{{ contact.get_gender_display }}</td>
            <td>{{ contact.age }}</td>
            <td><a class='btn btn-outline-primary' href="{% url 'recruitment:contact' study.pk participation.pseudonym %}">{% trans 'Call' %}</a></td>
        </tr>
        {% endfor %}
    </tbody>
</table>
