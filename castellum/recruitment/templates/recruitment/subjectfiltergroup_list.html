{% extends "base.html" %}
{% load i18n %}

{% block content %}
    <h1>{{ study.name }} &mdash; {% trans 'Filter Groups' %}</h1>

    <ul>
        {% for group in object_list %}
            <li><a href={% url 'recruitment:filter_update' study.pk group.pk %}>{{ group }}</li>
        {% endfor %}
    </ul>

    <a href="{% url 'studies:index' %}" class="btn btn-outline-primary">{% trans "Back" %}</a>

    <form class="d-inline" action="{% url 'recruitment:filter_create' study.pk %}" method="post">
        {% if not study.published %}
            {% csrf_token %}
            <button class="btn btn-primary">{% trans 'Add new' %}</button>
        {% else %}
            <button class="btn btn-primary" disabled>{% trans 'Add new' %}</button>
        {% endif %}
    </form>
{% endblock %}
