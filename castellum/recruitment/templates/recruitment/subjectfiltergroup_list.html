{% extends "base.html" %}
{% load i18n %}

{% block content %}
    <h1>{{ study.name }} &mdash; {% trans 'Filter Groups' %}</h1>

    <ul>
        {% for group in object_list %}
            <li><a href={% url 'recruitment:filter_update' study.pk group.pk %}>{{ group }}</li>
        {% endfor %}
    </ul>

    <form action="{% url 'recruitment:filter_create' study.pk %}" method="post">
        {% csrf_token %}
        <button class="btn btn-primary">{% trans 'Add new' %}</button>
    </form>
{% endblock %}
