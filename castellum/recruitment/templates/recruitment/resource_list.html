{% extends "base.html" %}
{% load static i18n %}

{% block title %}{% translate 'Resources' %} &middot; {{ block.super }}{% endblock %}

{% block content %}
    <p>{% translate 'The following resources are available:' %}</p>
    <ul>
        {% for res in object_list %}
            <li>
                {{ res }}
                <a href="{% url 'recruitment:resource-feed' res.pk %}?token={{ user.token }}" class="btn btn-sm btn-primary" title="{% translate 'Feed' %}">
                    <i class="far fa-calendar-plus" role="img" aria-label="{% translate 'Feed' %}"></i>
                </a>
            </li>
        {% endfor %}
    </ul>
{% endblock %}
