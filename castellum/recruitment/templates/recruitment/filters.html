{% extends "base.html" %}
{% load i18n bootstrap4 %}

{% block content %}
    <h1>{{ study.name }} &mdash; {% trans 'Filters' %}</h1>

    <p>{% trans 'matches' %}: {{ count }} / {{ total_count }}</p>

    <form method="post">
        {% csrf_token %}
        {{ formset.management_form }}

        {% for form in formset %}
            <formset class="row">
                {{ form }}
            </formset>
        {% endfor %}

        <input type="submit" class="btn btn-primary" />
    </form>
{% endblock %}
