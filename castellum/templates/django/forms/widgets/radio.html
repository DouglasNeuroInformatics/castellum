{% for group, options, index in widget.optgroups %}
    {% for option in options %}
        {% with option as widget %}
            <div class="form-check">
                <input type="radio" class="form-check-input" name="{{ widget.name }}" value="{{ widget.value }}" {% include "django/forms/widgets/attrs.html" %}>
                <label class="form-check-label" for="{{ widget.attrs.id }}">{{ widget.label }}</label>
            </div>
        {% endwith %}
    {% endfor %}
{% endfor %}
