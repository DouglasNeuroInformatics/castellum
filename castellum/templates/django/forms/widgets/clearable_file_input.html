{% load i18n %}

<div class="custom-file">
    <input type="file" class="custom-file-input" {% include "django/forms/widgets/attrs.html" %} name="{{ widget.name }}">
    <div class="custom-file-label">{% trans 'Choose file' %}</div>
</div>
{% if widget.is_initial %}
    {{ widget.initial_text }}: <a href="{{ widget.value.url }}">{{ widget.value }}</a>
    {% if not widget.required %}
        <div class="form-check">
            <input type="checkbox" class="form-check-input" name="{{ widget.checkbox_name }}" id="{{ widget.checkbox_id }}">
            <label class="form-check-label" for="{{ widget.checkbox_id }}">{{ widget.clear_checkbox_label }}</label>
        </div>
    {% endif %}
{% endif %}
