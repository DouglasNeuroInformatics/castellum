{% extends "appointments/resource_base.html" %}
{% load i18n auth %}

{% block content %}
    <ul class="table-list">
        {% for resource in object_list %}
            <li class="table-list-item">
                <a class="h4 link-lite"href="{% url 'appointments:resource-detail' resource.pk %}" class="btn btn-link">{{ resource }}</a>
            </li>
        {% empty %}
            <li class="alert alert-warning">
                {% translate 'No resources' %}
            </li>
        {% endfor %}
    </ul>
{% endblock %}
