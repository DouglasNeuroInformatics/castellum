[tool:pytest]
addopts=
    --ds=castellum.settings.development
    --cov=castellum
    --cov-branch
    --cov-report term-missing:skip-covered
    --cov-report html
    --cov-fail-under=80
    --no-cov-on-fail
    --strict-markers
markers=
    unittest: marks tests as fast. They test only one function and don't need access to the database
    smoketest: simple tests that only check for 200 status code


[flake8]
exclude=
    .venv,
    .tox,
    migrations,
    settings,
    settings.py,
max-line-length=100


[isort]
known_django=django
sections=STDLIB,DJANGO,THIRDPARTY,FIRSTPARTY,LOCALFOLDER
force_single_line=True
skip=migrations
line_length=100


[coverage:report]
omit=
    manage.py
    castellum/wsgi.py
    castellum/settings/*
    castellum/*/migrations/*
skip_covered=True
skip_empty=True
