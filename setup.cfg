[tool:pytest]
addopts=
    --ds=castellum.settings
    --cov=castellum
    --cov-branch
    --cov-report term-missing:skip-covered
    --cov-report html
    --cov-fail-under=80
    --strict-markers
markers=
    freeze_time: decorator from freezegun package
    unittest: marks tests as fast. They test only one function and don't need access to the database


[flake8]
exclude=
    .venv,
    .tox,
    migrations,
    settings,
    settings.py,
max-line-length=100


[isort]
known_django=django
sections=STDLIB,DJANGO,THIRDPARTY,FIRSTPARTY,LOCALFOLDER
force_single_line=True
skip=migrations


[coverage:report]
omit=
    */migrations/*
    */wsgi.py
    */manage.py
