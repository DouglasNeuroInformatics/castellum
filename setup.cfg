[metadata]
name = castellum
version = 0.0.1
author = Max-Planck-Gesellschaft
license = AGPL-3.0-or-later

[options]
include_package_data = True
packages = find:
install_requires =
    castellum-pseudonyms == 0.0.1
    cologne-phonetics == 1.2.5
    Django == 3.1.4
    django-bootstrap4 == 2.3.1
    django-ical == 1.7.1
    django-npm == 1.0.0
    django-parler == 2.2.0
    django-phonenumber-field == 5.0.0
    django-stronghold == 0.4.0
    Faker == 5.0.1
    file-magic == 0.4.0
    geopy == 2.0.0
    icalendar == 4.0.7
    jsonschema == 3.2.0
    phonenumberslite == 8.12.14
    python-dateutil == 2.8.1
    requests == 2.25.0
    simplecharts == 0.0.2

[tool:pytest]
addopts =
    --ds=castellum.settings.development
    --cov=castellum
    --cov-branch
    --cov-report term-missing:skip-covered
    --cov-report html
    --cov-fail-under=80
    --no-cov-on-fail
    --strict-markers
markers =
    unittest: marks tests as fast. They test only one function and don't need access to the database
    smoketest: simple tests that only check for 200 status code

[flake8]
exclude =
    .venv,
    .git,
    .tox,
    migrations,
    settings,
    docs,
max-line-length = 100

[isort]
known_django = django
sections = STDLIB,DJANGO,THIRDPARTY,FIRSTPARTY,LOCALFOLDER
force_single_line = True
skip = migrations
line_length = 100

[coverage:report]
omit =
    manage.py
    castellum/wsgi.py
    castellum/settings/*
    castellum/*/migrations/*
skip_covered = True
skip_empty = True
