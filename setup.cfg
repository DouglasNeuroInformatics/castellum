[metadata]
name = castellum
version = attr: castellum.__version__
author = Max-Planck-Gesellschaft
author_email = castellum@mpib-berlin.mpg.de
license = AGPL-3.0-or-later
url = https://git.mpib-berlin.mpg.de/castellum/castellum

[options]
include_package_data = True
packages = find:
install_requires =
    castellum-pseudonyms == 0.0.1
    cologne-phonetics == 1.3.1
    Django == 4.2.7
    django-bootstrap5 == 23.3
    django-bootstrap-colors == 5.3.0
    django-mfa3 == 0.11.0
    django-npm == 1.0.0
    django-parler == 2.3
    django-phonenumber-field == 7.2.0
    django-stronghold == 0.4.0
    Faker == 20.1.0
    geopy == 2.4.0
    icalendar == 5.0.5
    icalevents == 0.1.25
    jsonschema == 4.20.0
    phonenumberslite == 8.13.25
    python-dateutil == 2.8.2
    requests == 2.31.0
    simplecharts == 0.0.2

[options.extras_require]
ldap =
    django-auth-ldap == 4.6.0
axes =
    django-axes[ipware] == 6.1.1
model-stats =
    django-model-stats == 0.0.2
test =
    pytest
    pytest-cov
    pytest-django
    pytest-freezegun
    django-test-migrations
    model-bakery
    lxml
    ruff
    pospell
dev =
    ipdb
    django-debug-toolbar
