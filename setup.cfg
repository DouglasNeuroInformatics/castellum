[metadata]
name = castellum
version = attr: castellum.__version__
author = Max-Planck-Gesellschaft
author_email = castellum@mpib-berlin.mpg.de
license = AGPL-3.0-or-later
url = https://git.mpib-berlin.mpg.de/castellum/castellum

[options]
include_package_data = True
packages = find:
install_requires =
    castellum-pseudonyms == 0.0.1
    cologne-phonetics == 1.3.1
    Django == 4.2.2
    django-bootstrap5 == 23.1
    django-bootstrap-colors == 5.3.0
    django-mfa3 == 0.11.0
    django-npm == 1.0.0
    django-parler == 2.3
    django-phonenumber-field == 7.1.0
    django-stronghold == 0.4.0
    Faker == 18.9.0
    geopy == 2.3.0
    icalendar == 5.0.5
    icalevents == 0.1.25
    jsonschema == 4.17.3
    phonenumberslite == 8.13.13
    python-dateutil == 2.8.2
    requests == 2.31.0
    simplecharts == 0.0.2

[options.extras_require]
test =
    pytest
    pytest-cov
    pytest-django
    pytest-freezegun
    django-test-migrations
    model-bakery
    lxml
    flake8
    flake8-sfs
    flake8-print
    flake8-copyright
    isort
    pospell
dev =
    ipdb
    django-debug-toolbar

[tool:pytest]
addopts =
    --ds=castellum.settings.development
    --cov=castellum
    --cov-branch
    --cov-report term-missing:skip-covered
    --cov-report html
    --no-cov-on-fail
    --strict-markers
markers =
    unittest: marks tests as fast. They test only one function and don't need access to the database
    smoketest: simple tests that only check for 200 status code
testpaths = tests

[flake8]
exclude =
    .venv,
    .git,
    .tox,
    migrations,
    settings,
    docs,
    node_modules,
max-line-length = 88
extend-ignore = SFS201,SFS301
max-complexity = 8
copyright-check = True
copyright-regexp = \(c\) 2018-2023 MPIB
per-file-ignores =
    tests/*:C801
    castellum/asgi.py:C801
    castellum/wsgi.py:C801
    castellum/*/__init__.py:C801
    setup.py:C801
    manage.py:C801

[isort]
force_single_line = True
skip = migrations
line_length = 88

[coverage:report]
omit =
    manage.py
    castellum/wsgi.py
    castellum/settings/*
    castellum/*/migrations/*.py
skip_covered = True
skip_empty = True
