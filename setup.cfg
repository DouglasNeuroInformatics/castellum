[metadata]
name = castellum
version = 0.64.0
author = Max-Planck-Gesellschaft
author_email = goettel@mpib-berlin.mpg.de
license = AGPL-3.0-or-later
url = https://git.mpib-berlin.mpg.de/castellum/castellum

[options]
include_package_data = True
packages = find:
install_requires =
    castellum-pseudonyms == 0.0.1
    cologne-phonetics == 1.3.0
    Django == 3.2.6
    django-bootstrap4 == 3.0.1
    django-ical == 1.8.0
    django-mfa3 == 0.3.0
    django-npm == 1.0.0
    django-parler == 2.2.0
    django-phonenumber-field == 5.2.0
    django-stronghold == 0.4.0
    Faker == 8.11.0
    file-magic == 0.4.0
    geopy == 2.2.0
    icalendar == 4.0.7
    jsonschema == 3.2.0
    phonenumberslite == 8.12.29
    python-dateutil == 2.8.2
    requests == 2.26.0
    simplecharts == 0.0.2

[options.extras_require]
test =
    pytest
    pytest-cov
    pytest-django
    pytest-freezegun
    model-bakery
    lxml
    flake8
    flake8-sfs
    isort
    pospell
dev =
    ipdb
    django-debug-toolbar
    psycopg2-binary

[tool:pytest]
addopts =
    --ds=castellum.settings.development
    --cov=castellum
    --cov-branch
    --cov-report term-missing:skip-covered
    --cov-report html
    --cov-fail-under=80
    --no-cov-on-fail
    --strict-markers
markers =
    unittest: marks tests as fast. They test only one function and don't need access to the database
    smoketest: simple tests that only check for 200 status code
testpaths = tests

[flake8]
exclude =
    .venv,
    .git,
    .tox,
    migrations,
    settings,
    docs,
    node_modules,
max-line-length = 100
extend-ignore = SFS201
max-complexity = 8

[isort]
known_django = django
sections = STDLIB,DJANGO,THIRDPARTY,FIRSTPARTY,LOCALFOLDER
force_single_line = True
skip = migrations
line_length = 100

[coverage:report]
omit =
    manage.py
    castellum/wsgi.py
    castellum/settings/*
    castellum/*/migrations/*
skip_covered = True
skip_empty = True
