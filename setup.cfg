[metadata]
name = castellum
version = attr: castellum.__version__
author = Max-Planck-Gesellschaft
author_email = castellum@mpib-berlin.mpg.de
license = AGPL-3.0-or-later
url = https://git.mpib-berlin.mpg.de/castellum/castellum

[options]
include_package_data = True
packages = find:
install_requires =
    castellum-pseudonyms == 0.0.1
    cologne-phonetics == 1.3.1
    Django == 3.2.18
    django-bootstrap5 == 22.2
    django-mfa3 == 0.8.0
    django-npm == 1.0.0
    django-parler == 2.3
    django-phonenumber-field == 7.0.2
    django-stronghold == 0.4.0
    Faker == 17.0.0
    geopy == 2.3.0
    icalendar == 5.0.4
    icalevents == 0.1.25
    jsonschema == 4.17.3
    phonenumberslite == 8.13.6
    python-dateutil == 2.8.2
    requests == 2.28.2
    simplecharts == 0.0.2
    qrcode < 7.4  # https://github.com/lincolnloop/python-qrcode/issues/317

[options.extras_require]
test =
    pytest
    pytest-cov
    pytest-django
    pytest-freezegun
    django-test-migrations
    model-bakery
    lxml
    ruff
    pospell
dev =
    ipdb
    django-debug-toolbar
