[metadata]
name = castellum
version = attr: castellum.__version__
author = Max-Planck-Gesellschaft
author_email = castellum@mpib-berlin.mpg.de
license = AGPL-3.0-or-later
url = https://git.mpib-berlin.mpg.de/castellum/castellum

[options]
include_package_data = True
packages = find:
install_requires =
    castellum-pseudonyms == 0.0.1
    cologne-phonetics == 2.0.0
    Django == 4.2.13
    django-bootstrap5 == 24.2
    django-bootstrap-colors == 5.3.0
    django-mfa3 == 0.12.1
    django-npm == 1.0.0
    django-parler == 2.3
    django-phonenumber-field == 7.3.0
    django-stronghold == 0.4.0
    Faker == 24.14.1
    geopy == 2.4.1
    icalendar == 5.0.12
    icalevents == 0.1.25
    jsonschema == 4.21.1
    phonenumberslite == 8.13.35
    python-dateutil == 2.9.0.post0
    requests == 2.31.0
    simplecharts == 0.0.2

[options.extras_require]
ldap =
    django-auth-ldap == 4.8.0
axes =
    django-axes[ipware] == 6.4.0
model-stats =
    django-model-stats == 0.0.2
storage-timestamps =
    django-storage-timestamps == 0.1.1
test =
    pytest
    pytest-cov
    pytest-django
    pytest-freezegun
    django-test-migrations
    model-bakery
    lxml
    ruff == 0.4.2
    pospell
dev =
    ipdb
    django-debug-toolbar
