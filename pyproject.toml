[tool.ruff]
select = ["E", "F", "W", "C9", "I", "N", "Q", "UP", "RUF", "ISC", "T20"]
ignore = ["RUF012"]
extend-exclude = [
    "migrations",
    "settings",
]

[tool.ruff.isort]
force-single-line = true

[tool.ruff.flake8-quotes]
inline-quotes = "single"

[tool.pytest.ini_options]
addopts = [
    "--ds=castellum.settings.development",
    "--cov=castellum",
    "--cov-branch",
    "--cov-report=term-missing:skip-covered",
    "--cov-report=html",
    "--no-cov-on-fail",
    "--strict-markers",
]
markers = [
    "unittest: marks tests as fast. They test only one function and don't need access to the database",
    "smoketest: simple tests that only check for 200 status code",
]
testpaths = ["tests"]

[tool.coverage.report]
omit = [
    "manage.py",
    "castellum/wsgi.py",
    "castellum/settings/*",
    "castellum/*/migrations/*.py",
]
skip_covered = true
skip_empty = true
