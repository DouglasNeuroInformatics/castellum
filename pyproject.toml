[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[tool.pytest.ini_options]
addopts = [
    "--ds=castellum.settings.development",
    "--cov=castellum",
    "--cov-branch",
    "--cov-report term-missing:skip-covered",
    "--cov-report html",
    "--no-cov-on-fail",
    "--strict-markers",
]
markers = [
    "unittest: marks tests as fast. They test only one function and don't need access to the database",
    "smoketest: simple tests that only check for 200 status code"
]
testpaths = ["tests"]

[tool.ruff]
select = ["C9", "Q", "E", "F", "I", "ISC", "N", "T20", "UP", "W", "RUF"]
target-version = "py37"
line-length = 100
exclude = [
    ".venv",
    ".git",
    ".tox",
    "migrations",
    "settings",
    "docs",
    "node_modules",
]

[tool.ruff.mccabe]
max-complexity = 8

[tool.ruff.isort]
force-single-line = true

[tool.ruff.flake8-quotes]
inline-quotes = "single"
