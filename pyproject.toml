[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "castellum"
license = "AGPL-3.0-or-later"
requires-python = ">= 3.10"
dependencies = [
    "castellum-pseudonyms ~= 0.0.3",
    "cryptography ~= 41.0.0",
    "cologne-phonetics ~= 2.0.0",
    "Django ~= 5.2.14",
    "django-bootstrap5 ~= 26.2",
    "django-bootstrap-colors ~= 5.4.1",
    "django-mfa3 ~= 1.1.0",
    "django-parlor ~= 0.0.3",
    "django-phonenumber-field ~= 8.4.0",
    "Faker ~= 40.0.0",
    "geopy ~= 2.4.1",
    "icalendar ~= 7.0.3",
    "icalevents ~= 0.3.1",
    "jsonschema ~= 4.26.0",
    "phonenumberslite ~= 9.0.0",
    "python-dateutil ~= 2.9.0.post0",
    "requests ~= 2.32.5",
    "simplecharts ~= 0.2.0",
]
authors = [
    {name = "Max-Planck-Gesellschaft", email = "castellum@mpib-berlin.mpg.de"},
]
dynamic = ["version"]

[project.urls]
Homepage = "https://git.mpib-berlin.mpg.de/castellum/castellum"

[tool.setuptools]
packages = ["castellum"]

[project.optional-dependencies]
ldap = ["django-auth-ldap ~= 5.3.0"]
axes = ["django-axes[ipware] ~= 8.3.1"]
model-stats = ["django-model-stats ~= 0.0.2"]
storage-timestamps = ["django-storage-timestamps ~= 0.1.1"]
test = [
    "pytest",
    "pytest-cov",
    "pytest-django == 4.10.0",  # https://github.com/pytest-dev/pytest-django/issues/1192
    "freezegun",
    "django-test-migrations",
    "model-bakery",
    "lxml",
    "ruff",
    "polib",
]
dev = [
    "ipdb",
    "django-debug-toolbar",
    "sphinx",
    "sphinx-rtd-theme",
]

[tool.setuptools.dynamic]
version = {attr = "castellum.__version__"}

[tool.ruff]
extend-exclude = [
    "migrations",
    "settings",
]

[tool.ruff.lint]
select = ["E", "F", "W", "C9", "I", "N", "Q", "UP", "RUF", "ISC", "T20"]
ignore = ["RUF012"]

[tool.ruff.lint.isort]
force-single-line = true

[tool.ruff.lint.flake8-quotes]
inline-quotes = "single"

[tool.ruff.format]
quote-style="single"

[tool.pytest.ini_options]
addopts = [
    "--ds=castellum.settings.development",
    "--cov=castellum",
    "--cov-branch",
    "--cov-report=term-missing:skip-covered",
    "--cov-report=html",
    "--no-cov-on-fail",
    "--strict-markers",
]
testpaths = ["tests"]

[tool.coverage.report]
omit = [
    "manage.py",
    "castellum/wsgi.py",
    "castellum/settings/*",
    "castellum/*/migrations/*.py",
]
skip_covered = true
skip_empty = true
